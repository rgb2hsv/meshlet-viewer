<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 480" width="724" height="480" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
<rect width="724" height="480" fill="#ffffff"/>
