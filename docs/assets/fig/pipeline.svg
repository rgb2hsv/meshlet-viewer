<line x1="348" y1="77.0" x2="374" y2="77.0" stroke="#5c6370" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="554" y="50" width="150" height="54" rx="8" fill="#f4f6fb" stroke="#8a94a6" stroke-width="1.3"/>
