<text x="95.0" y="447.0" font-size="11" font-weight="400" text-anchor="middle" fill="#555">compute, 1 pass / depth</text>
<rect x="198" y="406" width="150" height="54" rx="8" fill="#fbf1e6" stroke="#c99a62" stroke-width="1.3"/>
<text x="273.0" y="430.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1f">Task shader</text>
<text x="273.0" y="447.0" font-size="11" font-weight="400" text-anchor="middle" fill="#555">LOD test + culling</text>
<line x1="170" y1="433.0" x2="196" y2="433.0" stroke="#5c6370" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="376" y="406" width="150" height="54" rx="8" fill="#fbf1e6" stroke="#c99a62" stroke-width="1.3"/>
<text x="451.0" y="430.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1f">Mesh shader</text>
<text x="451.0" y="447.0" font-size="11" font-weight="400" text-anchor="middle" fill="#555">1 workgroup / meshlet</text>
<line x1="348" y1="433.0" x2="374" y2="433.0" stroke="#5c6370" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="554" y="406" width="150" height="54" rx="8" fill="#fbf1e6" stroke="#c99a62" stroke-width="1.3"/>
<text x="629.0" y="430.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1f">Fragment shader</text>
<text x="629.0" y="447.0" font-size="11" font-weight="400" text-anchor="middle" fill="#555">color, outlines</text>
<line x1="526" y1="433.0" x2="552" y2="433.0" stroke="#5c6370" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="273.0" y1="338" x2="273.0" y2="404" stroke="#5c6370" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="281.0" y="374" font-size="11.5" font-weight="400" text-anchor="start" fill="#555">upload to GPU buffers</text>
