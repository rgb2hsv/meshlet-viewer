<text x="273.0" y="201.0" font-size="11" font-weight="400" text-anchor="middle" fill="#555">to 50% of triangles</text>
<line x1="374" y1="187.0" x2="350" y2="187.0" stroke="#5c6370" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="20" y="160" width="150" height="54" rx="8" fill="#eef6ee" stroke="#7fa37f" stroke-width="1.3"/>
