<text x="273.0" y="306.0" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1f">Group BVH</text>
<text x="273.0" y="323.0" font-size="11" font-weight="400" text-anchor="middle" fill="#555">clodBuildHierarchy</text>
