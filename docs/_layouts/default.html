<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="https://github.com/{{ site.repository }}">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="wrap site-footer">
    Hierarchies by <a href="https://github.com/zeux/meshoptimizer">meshoptimizer</a> and <a href="https://github.com/rgb2hsv/meshlet-optimizer">meshlet-optimizer</a>.
    Figures generated by <code>docs/_figures/gen_figures.py</code>, tables by <code>docs/_figures/mlod_stats.py</code>, renders by the viewer's <code>--screenshot</code> mode.
  </footer>
</body>
</html>
